<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#11111B" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89B4FA" />
      <stop offset="50%" stop-color="#CBA6F7" />
      <stop offset="100%" stop-color="#F5C2E7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="400" rx="24" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="780" height="380" rx="16" fill="none" stroke="#313244" stroke-width="2" />

  <!-- Decorative Accent Dots -->
  <circle cx="40" cy="40" r="6" fill="#F38BA8" />
  <circle cx="60" cy="40" r="6" fill="#FAB387" />
  <circle cx="80" cy="40" r="6" fill="#A6E3A1" />

  <!-- Dynamic Text Node -->
  <text 
    id="dynamic-text" 
    x="50%" 
    y="50%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="48" 
    font-weight="bold" 
    fill="url(#textGrad)" 
    filter="url(#shadow)">
    Loading...
  </text>

  <!-- Script to parse URL parameters -->
  <script type="text/javascript">
    <![CDATA[
      document.addEventListener('DOMContentLoaded', () => {
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const userText = params.get('text');

        const textElement = document.getElementById('dynamic-text');

        if (userText !== null && userText.trim() !== '') {
          // Set the text content safely
          textElement.textContent = userText;
        } else {
          // Default fallback text if ?text= is missing or empty
          textElement.textContent = 'Hello World!';
        }
      });
    ]]>
  </script>
</svg>
